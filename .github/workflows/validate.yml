name: Validate Thalarch

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate package structure
        run: python scripts/validation/validate_thalarch.py .

      - name: Validate autoresearch engine
        run: python scripts/validation/validate_autoresearch.py .

      - name: Validate anti-hallucination hard gates
        run: python scripts/validation/validate_hard_gates.py .

      - name: Validate supply-chain provenance
        run: python scripts/validation/validate_supply_chain.py .

      - name: Validate Codex and Claude adapters
        run: python scripts/validation/validate_adapters.py .

      - name: Validate cross-host reliability and visual policy
        run: python scripts/validation/validate_cross_host_policy.py .

      - name: Validate cross-model benchmark suite
        run: python scripts/validation/validate_benchmarks.py .

      - name: Check shell installer syntax
        run: bash -n INSTALL.sh

      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw ./INSTALL.ps1))
