<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Thalarch</title>
  <desc id="desc">High-rigor multi-agent reliability harness for Codex, Claude, Gemini and Antigravity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="0.55" stop-color="#fbfaf8"/>
      <stop offset="1" stop-color="#f6fbfb"/>
    </linearGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f86e8"/>
      <stop offset="0.28" stop-color="#d3cff7"/>
      <stop offset="0.5" stop-color="#8fd8e2"/>
      <stop offset="0.72" stop-color="#e4c8bc"/>
      <stop offset="1" stop-color="#91a4dc"/>
    </linearGradient>
    <linearGradient id="ringB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf5ff"/>
      <stop offset="0.45" stop-color="#a8d9e2"/>
      <stop offset="0.7" stop-color="#b3a9ef"/>
      <stop offset="1" stop-color="#f0d6c8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7169c8"/>
      <stop offset="0.5" stop-color="#4a879e"/>
      <stop offset="1" stop-color="#d99b6d"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#68748a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="22" fill="url(#bg)" stroke="#dce3e8"/>

  <!-- quiet technical texture -->
  <g fill="#8e88d4" opacity="0.17">
    <circle cx="38" cy="40" r="1.4"/><circle cx="51" cy="40" r="1.4"/><circle cx="64" cy="40" r="1.4"/>
    <circle cx="38" cy="53" r="1.4"/><circle cx="51" cy="53" r="1.4"/><circle cx="64" cy="53" r="1.4"/>
    <circle cx="1117" cy="300" r="1.4"/><circle cx="1130" cy="300" r="1.4"/><circle cx="1143" cy="300" r="1.4"/>
    <circle cx="1117" cy="313" r="1.4"/><circle cx="1130" cy="313" r="1.4"/><circle cx="1143" cy="313" r="1.4"/>
  </g>
  <path d="M30 85h50l18 18h54" fill="none" stroke="#94a9c8" stroke-width="1" opacity="0.25"/>
  <circle cx="156" cy="103" r="2" fill="#75bbc5" opacity="0.55"/>
  <path d="M1046 65h59l18 18h47" fill="none" stroke="#86c8cf" stroke-width="1" opacity="0.24"/>
  <circle cx="1042" cy="65" r="2" fill="#d4a27c" opacity="0.52"/>

  <!-- Thalarch orbital mark -->
  <ellipse cx="236" cy="185" rx="131" ry="123" fill="#a79de8" opacity="0.09" filter="url(#soft)"/>
  <g transform="rotate(-18 236 185)" filter="url(#shadow)">
    <ellipse cx="236" cy="185" rx="112" ry="83" fill="none" stroke="url(#ringA)" stroke-width="28"/>
    <ellipse cx="236" cy="185" rx="100" ry="72" fill="none" stroke="url(#ringB)" stroke-width="13" opacity="0.94"/>
    <ellipse cx="236" cy="185" rx="91" ry="63" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.72"/>
    <path d="M132 185c30-58 92-92 153-72 36 12 65 39 78 72" fill="none" stroke="#7069cc" stroke-width="2" opacity="0.42"/>
    <path d="M120 196c39 60 116 88 180 51 23-13 41-31 54-54" fill="none" stroke="#5eb8c6" stroke-width="2" opacity="0.38"/>
  </g>
  <g fill="none" stroke="#9b96d8" opacity="0.34">
    <ellipse cx="236" cy="185" rx="151" ry="132" stroke-dasharray="2 10"/>
    <ellipse cx="236" cy="185" rx="166" ry="143" stroke-dasharray="1 13"/>
  </g>
  <circle cx="87" cy="185" r="4" fill="#6fc7d0"/><circle cx="353" cy="119" r="4" fill="#dca275"/>
  <circle cx="288" cy="59" r="4" fill="#8d83df"/><circle cx="356" cy="252" r="3.5" fill="#76c1c7"/>

  <!-- protocol label -->
  <rect x="456" y="60" width="286" height="38" rx="19" fill="#ffffff" fill-opacity="0.74" stroke="#b6b2d5"/>
  <circle cx="477" cy="79" r="4" fill="#746fd3"/>
  <text x="494" y="84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" letter-spacing="4" fill="#656587">SKILL PROTOCOL</text>
  <circle cx="650" cy="79" r="2.5" fill="#cda071"/>
  <text x="664" y="84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" letter-spacing="3" fill="#a07b61">1.0.0</text>

  <!-- title -->
  <text x="454" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="600" letter-spacing="14" fill="#25354d">THALARCH</text>
  <path d="M455 208h28" stroke="url(#accent)" stroke-width="2"/>
  <text x="496" y="214" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="4.2" fill="#667080">HIGH-RIGOR MULTI-AGENT RELIABILITY HARNESS</text>
  <path d="M1010 208h24" stroke="url(#accent)" stroke-width="2"/>

  <!-- provider cards -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" letter-spacing="1.2">
    <g transform="translate(454 246)">
      <rect width="153" height="62" rx="13" fill="#fff" fill-opacity="0.72" stroke="#b9d7d4"/>
      <g transform="translate(20 18)" fill="none" stroke="#2d7f78" stroke-width="2.2">
        <circle cx="13" cy="13" r="10"/><circle cx="13" cy="13" r="6"/><path d="M13 3v20M3 13h20M6 6l14 14M20 6L6 20"/>
      </g>
      <text x="58" y="38" fill="#243047">CODEX</text>
    </g>
    <g transform="translate(621 246)">
      <rect width="153" height="62" rx="13" fill="#fff" fill-opacity="0.72" stroke="#e5c9b5"/>
      <g transform="translate(641 264)" stroke="#d98355" stroke-width="3" stroke-linecap="round">
        <path d="M13 0v26M0 13h26M4 4l18 18M22 4L4 22M8 1l10 24M25 8L1 18"/>
      </g>
      <text x="58" y="38" fill="#243047">CLAUDE</text>
    </g>
    <g transform="translate(788 246)">
      <rect width="153" height="62" rx="13" fill="#fff" fill-opacity="0.72" stroke="#c7d2ea"/>
      <path d="M814 264c3 9 8 14 17 17-9 3-14 8-17 17-3-9-8-14-17-17 9-3 14-8 17-17z" fill="#6684da"/>
      <text x="58" y="38" fill="#243047">GEMINI</text>
    </g>
    <g transform="translate(955 246)">
      <rect width="210" height="62" rx="13" fill="#fff" fill-opacity="0.72" stroke="#b9d9d8"/>
      <path d="M980 292l12-28 12 28h-7l-5-13-5 13z" fill="url(#accent)"/>
      <path d="M988 283h9" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="64" y="38" fill="#243047">ANTIGRAVITY</text>
    </g>
  </g>
</svg>