<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>

    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0C1326"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#FFFFFF" opacity="0.03"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Emblem Gradients -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    
    <linearGradient id="coreFissure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    
    <radialGradient id="vortexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0C1326" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bgRadialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0C1326" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="1196" height="376" rx="16" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="376" rx="16" fill="url(#dotGrid)"/>

  <!-- Geometric Emblem (Left) -->
  <g transform="translate(240, 190) scale(1.5)">

    <!-- Soft bioluminescent radial glow behind emblem -->
    <circle cx="0" cy="0" r="140" fill="url(#bgRadialGlow)" filter="url(#heavyGlow)"/>

    <!-- Orbiting Constellation Elements -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.3"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#00F0FF" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Micro-coordinate crosshairs (+) -->
    <path d="M -95 -4 L -95 4 M -99 0 L -91 0" stroke="#00F0FF" stroke-width="1" opacity="0.8"/>
    <path d="M 95 -4 L 95 4 M 91 0 L 99 0" stroke="#00F0FF" stroke-width="1" opacity="0.8"/>
    <path d="M -4 -95 L 4 -95 M 0 -99 L 0 -91" stroke="#00F0FF" stroke-width="1" opacity="0.8"/>
    <path d="M -4 95 L 4 95 M 0 91 L 0 99" stroke="#00F0FF" stroke-width="1" opacity="0.8"/>
    
    <!-- 6 glowing agent constellation nodes -->
    <circle cx="-65" cy="-65" r="3" fill="#00F0FF" filter="url(#glow)"/>
    <circle cx="70" cy="-40" r="2.5" fill="#10B981" filter="url(#glow)"/>
    <circle cx="-85" cy="15" r="2" fill="#00F0FF" filter="url(#glow)"/>
    <circle cx="55" cy="70" r="3" fill="#00F0FF" filter="url(#glow)"/>
    <circle cx="20" cy="-85" r="2.5" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="-35" cy="80" r="2" fill="#10B981" filter="url(#glow)"/>

    <!-- Abyssal vortex background glow -->
    <circle cx="0" cy="45" r="45" fill="url(#vortexGlow)" filter="url(#glow)"/>

    <!-- Flanking Kinetic Fins/Wings -->
    <!-- Left Fin -->
    <polygon points="-25,-25 -60,-10 -40,35 -20,15" fill="#0C1326" stroke="#00F0FF" stroke-width="1" opacity="0.8"/>
    <polygon points="-25,-25 -60,-10 -45,-5 -25,-5" fill="url(#plateGrad)" opacity="0.4"/>
    <!-- Right Fin -->
    <polygon points="25,-25 60,-10 40,35 20,15" fill="#0C1326" stroke="#00F0FF" stroke-width="1" opacity="0.8"/>
    <polygon points="25,-25 60,-10 45,-5 25,-5" fill="url(#plateGrad)" opacity="0.4"/>

    <!-- Upper Arch: Interlocking geometric crystal plates -->
    <!-- Main top plate -->
    <polygon points="-45,-50 45,-50 25,-25 -25,-25" fill="url(#plateGrad)" stroke="#00F0FF" stroke-width="1.5"/>
    <!-- Top crown tip -->
    <polygon points="-25,-50 0,-70 25,-50" fill="#FFFFFF" opacity="0.9" stroke="#00F0FF" stroke-width="1"/>
    
    <!-- Downward Spire: Segmented, glowing kinetic pillar -->
    <!-- Upper spire block -->
    <polygon points="-15,-25 15,-25 10,15 -10,15" fill="#0C1326" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Lower spire descending into vortex -->
    <polygon points="-10,15 10,15 0,65" fill="#060911" stroke="#00F0FF" stroke-width="1"/>
    
    <!-- Core Energy Fissure -->
    <polygon points="-4,-20 4,-20 2,45 -2,45" fill="url(#coreFissure)" filter="url(#glow)"/>
    <polygon points="-1.5,-20 1.5,-20 0.5,45 -0.5,45" fill="#FFFFFF"/>

  </g>

  <!-- Typography (Right) -->
  <g transform="translate(480, 170)">
    <!-- Skill Badge (Proper bounding box and padding) -->
    <g transform="translate(0, -80)">
      <!-- 340px width allows generous room for the 39 chars text -->
      <rect x="0" y="0" width="340" height="26" rx="12" fill="#0D1A2A" stroke="#00F0FF" stroke-width="1" opacity="0.8"/>
      <!-- Glowing dot shifted to fit with margin -->
      <circle cx="16" cy="13" r="4" fill="#00F0FF" filter="url(#glow)"/>
      <text x="32" y="17.5" fill="#00F0FF" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.1em">SKILL: thalarch-mode • GOOGLE ANTIGRAVITY</text>
    </g>

    <!-- Main Title -->
    <!-- Font size 72, letter-spacing 0.2em, textGrad -->
    <text x="0" y="20" fill="url(#textGrad)" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="800" letter-spacing="0.2em">THALARCH</text>
    
    <!-- Subtitle -->
    <text x="2" y="65" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" letter-spacing="0.3em">HIGH-RIGOR MULTI-AGENT ENGINEERING PROTOCOL</text>
    
    <!-- Protocol Tags / Micro-pills -->
    <g transform="translate(2, 95)" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#00F0FF">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="170" height="20" rx="4" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.5"/>
        <text x="85" y="13.5" text-anchor="middle">[ STRUCTURAL DELEGATION ]</text>
      </g>
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="150" height="20" rx="4" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.5"/>
        <text x="75" y="13.5" text-anchor="middle">[ COLD VERIFICATION ]</text>
      </g>
      <g transform="translate(340, 0)">
        <rect x="0" y="0" width="135" height="20" rx="4" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.5"/>
        <text x="67.5" y="13.5" text-anchor="middle">[ ANTIGRAVITY 2.0 ]</text>
      </g>
    </g>
  </g>
</svg>
