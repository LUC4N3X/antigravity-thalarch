<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250">
  <defs>
    <linearGradient id="sigil-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-fx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="250" fill="transparent" />

  <!-- T Sigil, smaller and left aligned -->
  <g transform="translate(50, 45) scale(0.6)" filter="url(#glow-fx)">
    <path d="M 0 20 L 200 20 L 180 50 L 20 50 Z" fill="url(#sigil-glow)" />
    <path d="M 80 50 L 120 50 L 100 260 L 80 260 Z" fill="url(#sigil-glow)" />
    <path d="M 40 70 L 60 70 L 50 140 Z" fill="#0EA5E9" opacity="0.6" />
    <path d="M 160 70 L 140 70 L 150 140 Z" fill="#0EA5E9" opacity="0.6" />
    <path d="M -10 10 L 210 10 L 210 15 L -10 15 Z" fill="#E2E8F0" />
    <path d="M -10 15 L 0 50 L 10 50 L 0 20 Z" fill="#E2E8F0" />
    <path d="M 210 15 L 200 50 L 190 50 L 200 20 Z" fill="#E2E8F0" />
  </g>

  <!-- Typography -->
  <text x="240" y="140" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#E2E8F0" letter-spacing="8">THALARCH</text>
  <text x="248" y="185" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#0EA5E9" letter-spacing="4">HIGH-RIGOR MULTI-AGENT PROTOCOL</text>
</svg>
