<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#060913" />
    </radialGradient>
    <linearGradient id="sigil-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="metallic-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <filter id="glow-fx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg-glow)" />

  <g stroke="#14B8A6" stroke-opacity="0.1" stroke-width="1">
    <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384" />
    <path d="M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" />
    <circle cx="256" cy="256" r="200" fill="none" stroke-opacity="0.05" stroke-width="2" />
    <circle cx="256" cy="256" r="150" fill="none" stroke-dasharray="10, 10" stroke-opacity="0.15" />
    <circle cx="256" cy="256" r="100" fill="none" stroke-opacity="0.05" />
  </g>

  <!-- Central T Sigil -->
  <g transform="translate(156, 126)" filter="url(#glow-fx)">
    <!-- Top Bar -->
    <path d="M 0 20 L 200 20 L 180 50 L 20 50 Z" fill="url(#sigil-glow)" />
    <!-- Down Pillar -->
    <path d="M 80 50 L 120 50 L 100 260 L 80 260 Z" fill="url(#sigil-glow)" />
    <!-- Side architectural elements -->
    <path d="M 40 70 L 60 70 L 50 140 Z" fill="#0EA5E9" opacity="0.6" />
    <path d="M 160 70 L 140 70 L 150 140 Z" fill="#0EA5E9" opacity="0.6" />
    
    <!-- Outer metallic arch -->
    <path d="M -10 10 L 210 10 L 210 15 L -10 15 Z" fill="url(#metallic-edge)" />
    <path d="M -10 15 L 0 50 L 10 50 L 0 20 Z" fill="url(#metallic-edge)" />
    <path d="M 210 15 L 200 50 L 190 50 L 200 20 Z" fill="url(#metallic-edge)" />
  </g>

  <!-- Inner precision nodes -->
  <circle cx="256" cy="146" r="4" fill="#E2E8F0" />
  <circle cx="256" cy="386" r="4" fill="#E2E8F0" />
  <circle cx="176" cy="146" r="3" fill="#38BDF8" />
  <circle cx="336" cy="146" r="3" fill="#38BDF8" />
</svg>
